set-option -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-256color:hyperlinks"
# No escape time for Vim insert mode
set-option -g escape-time 0

# autoread for vim
set-option -g focus-events on

# Comfier prefix

unbind C-b
set -g prefix C-s
bind-key C-s send-prefix

# Mouse support

set -g mouse off
bind-key M if -F "#{mouse}" "set-option -g mouse off; display-message 'mouse: off'" "set-option -g mouse on; display-message 'mouse: on'"

set-window-option -g mode-keys vi

# Scrollback
set -g history-limit 50000

# Prevent tmux from renaming windows automatically
set-option -g allow-rename off

# Window and pane numbering

set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows 1
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Sessions

bind-key N command-prompt -p "new session:" "new-session -A -s '%%'"
# Project picker: live sessions, configured projects, and zoxide directories
bind-key T display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "$HOME/.local/bin/sesh-picker"

# New windows start in the current pane's directory, just like splits
bind-key c new-window -c "#{pane_current_path}"

# Splitting windows

bind-key s choose-tree -Zs
bind-key h split-window -v -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"

# Resizing panes

bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Display pane numbers

bind-key -n C-q display-panes

# Reload config in development

bind-key r source-file ~/.tmux.conf \; display-message "Reloaded!"

# macOS shell and clipboard integration

set -g default-shell "$SHELL"
set -s copy-command "pbcopy"

# Copy in VI Copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

#######
# TPM #
#######

# TPM itself
set -g @plugin 'tmux-plugins/tpm'

# Vim
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theme (must load before continuum: it overwrites status-right,
# where continuum injects its autosave hook)
set -g @plugin 'nordtheme/tmux'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# Default save key is C-s, which collides with C-s send-prefix
set -g @resurrect-save 'S'

# GUI-launched servers (WezTerm default_prog) get the bare launchd PATH,
# which breaks TPM's internal `tmux` calls
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin:/usr/sbin:/sbin"

if-shell '[ -d ~/.tmux/plugins/tpm ]' "run '~/.tmux/plugins/tpm/tpm'"

# Nord doesn't style chooser/copy selections; override tmux's yellow default.
set -g mode-style "bg=cyan,fg=black"

# Recolor the existing layout after TPM; preserve continuum's autosave hook.
run-shell "$HOME/.local/bin/terminal-theme --apply-tmux"
